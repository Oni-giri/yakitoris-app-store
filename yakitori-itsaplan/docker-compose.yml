# It's a Plan Community 1.13.0, adapted from
# https://github.com/croffasia/itsaplan/blob/v1.13.0/docker-compose.yml
#
# Umbrel-specific changes:
#   1. nginx merges the web app and API into one HTTPS-capable origin. The
#      nginx config is inlined so Umbrel updates reliably apply future changes.
#   2. Web and API use one canonical absolute HTTPS origin. Relative browser
#      URLs would break the app's MCP setup page and copied client configs.
#   3. Postgres, RustFS, and migration backups persist under APP_DATA_DIR/data.
#   4. Independent secrets are derived from the device seed in exports.sh.
#   5. All images are pinned to version tags and multi-architecture digests.

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-itsaplan_router_1
      APP_PORT: 80
      # The app has its own authentication for REST, MCP, SCIM, and Git
      # webhooks. Those non-browser clients cannot complete Umbrel's login.
      PROXY_AUTH_WHITELIST: "/api,/api/*,/.well-known/oauth-authorization-server*,/.well-known/oauth-protected-resource*,/.well-known/openid-configuration*"
      # Agent streams and MCP sessions can stay open for a long time.
      # Umbrel passes this value to Node's proxyTimeout, in milliseconds.
      PROXY_TIMEOUT: 3600000

  # Single-origin entry point. Inlined (NGINX_CONF) rather than bind-mounted
  # from the app folder so Umbrel app updates reliably apply config changes.
  #
  # External API_URL is <origin>/api. The API itself has no /api deployment
  # prefix, so /api/* is stripped before proxying. OAuth discovery documents
  # are sent to the API unchanged.
  router:
    image: nginx:1.30-alpine@sha256:8eb04fe3b385090e9aa02961f77398ad09b6bf33ab07f6669a5bb7acce22c0d3
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - printf '%s' "$$NGINX_CONF" > /etc/nginx/conf.d/default.conf && exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      NGINX_CONF: |
        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ''      close;
        }

        map $$http_x_forwarded_proto $$itsaplan_proto {
            default $$http_x_forwarded_proto;
            ''      $$scheme;
        }

        server {
            listen 80 default_server;
            server_name _;

            # The application enforces its own per-file limits in the interface.
            client_max_body_size 1G;
            absolute_redirect off;
            port_in_redirect off;

            # Resolve Docker names per request, including after a container recreation.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $$itsaplan_api yakitori-itsaplan_api_1:3000;
            set $$itsaplan_web yakitori-itsaplan_web_1:3001;

            location = /health {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            location = /api {
                return 308 /api/;
            }

            location /api/ {
                rewrite ^/api/(.*)$$ /$$1 break;

                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$itsaplan_proto;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;

                # MCP, agent chats, and agent runs are streaming endpoints.
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_pass http://$$itsaplan_api;
            }

            location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration)(/|$$) {
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$itsaplan_proto;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_pass http://$$itsaplan_api;
            }

            location / {
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$itsaplan_proto;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
                proxy_pass http://$$itsaplan_web;
            }
        }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: itsaplan
      POSTGRES_PASSWORD: ${APP_ITSAPLAN_POSTGRES_PASSWORD}
      POSTGRES_DB: itsaplan
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsaplan -d itsaplan"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # S3-compatible storage for issue attachments. The service remains private
  # to the app; the API streams attachment bytes to the web service.
  minio:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: on-failure
    stop_grace_period: 1m
    # Keep upstream's runtime user for this release. RustFS 1.0.0's existing
    # /logs directory is owned by UID 10001 and is not writable by arbitrary
    # UIDs; forcing 1000:1000 can prevent startup. Only /data is host-mounted.
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: itsaplan
      RUSTFS_SECRET_KEY: ${APP_ITSAPLAN_S3_SECRET}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_LOG_LEVEL: error
    volumes:
      - ${APP_DATA_DIR}/data/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Idempotently creates the attachment bucket, then exits.
  minio-init:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: itsaplan
      S3_SECRET_ACCESS_KEY: ${APP_ITSAPLAN_S3_SECRET}
      S3_BUCKET: planner-attachments
    entrypoint: >
      /bin/sh -c "
      curl -fsS -X PUT --aws-sigv4 aws:amz:us-east-1:s3
      --user \"$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY\"
      http://yakitori-itsaplan_minio_1:9000/\"$$S3_BUCKET\" &&
      echo 'bucket ready: '\"$$S3_BUCKET\"
      "

  # Backs up the database and applies migrations before application services
  # start. The backup directory is persistent and dumps are retained for 30 days.
  migrate:
    image: ghcr.io/croffasia/itsaplan-api:1.13.0@sha256:ce6115bc891a546da96746a8e1c002a9fe51128c8d5e720622c750ec079f6219
    # Deliberately not on-failure: every run takes a database dump first, so a
    # persistently failing migration would loop and fill db-backups with dumps.
    restart: "no"
    command: ["bun", "run", "packages/db/src/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://itsaplan:${APP_ITSAPLAN_POSTGRES_PASSWORD}@yakitori-itsaplan_postgres_1:5432/itsaplan
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      - ${APP_DATA_DIR}/data/db-backups:/backups

  api:
    image: ghcr.io/croffasia/itsaplan-api:1.13.0@sha256:ce6115bc891a546da96746a8e1c002a9fe51128c8d5e720622c750ec079f6219
    restart: on-failure
    init: true
    stop_grace_period: 1m
    # The migrate service has already run migrations.
    command: ["bun", "run", "apps/api/src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://itsaplan:${APP_ITSAPLAN_POSTGRES_PASSWORD}@yakitori-itsaplan_postgres_1:5432/itsaplan
      BETTER_AUTH_SECRET: ${APP_ITSAPLAN_AUTH_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ITSAPLAN_ENCRYPTION_KEY}

      # Canonical URLs are used for links, OAuth issuer metadata, and host-only
      # secure cookies. Browser traffic itself uses the same-origin /api route.
      API_URL: ${APP_ITSAPLAN_API_URL}
      APP_URL: ${APP_ITSAPLAN_PUBLIC_ORIGIN}
      COOKIE_DOMAIN: ""

      # Both nginx and Umbrel's gateway append to X-Forwarded-For. The API
      # skips those Docker proxy addresses when finding the real client.
      TRUSTED_PROXIES: ${APP_ITSAPLAN_TRUSTED_PROXIES:-10.21.0.0/16}

      S3_ENDPOINT: http://yakitori-itsaplan_minio_1:9000
      S3_BUCKET: planner-attachments
      S3_ACCESS_KEY_ID: itsaplan
      S3_SECRET_ACCESS_KEY: ${APP_ITSAPLAN_S3_SECRET}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Webhooks, imports, notifications, and agent schedules.
  worker:
    image: ghcr.io/croffasia/itsaplan-worker:1.13.0@sha256:4eba777fe6cded029962c313a1e70fda232123f6b1b22e3357b9656d7d4801cf
    restart: on-failure
    init: true
    stop_grace_period: 1m
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://itsaplan:${APP_ITSAPLAN_POSTGRES_PASSWORD}@yakitori-itsaplan_postgres_1:5432/itsaplan
      APP_ENCRYPTION_KEY: ${APP_ITSAPLAN_ENCRYPTION_KEY}
      TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      S3_ENDPOINT: http://yakitori-itsaplan_minio_1:9000
      S3_BUCKET: planner-attachments
      S3_ACCESS_KEY_ID: itsaplan
      S3_SECRET_ACCESS_KEY: ${APP_ITSAPLAN_S3_SECRET}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  # Telegram long polling must remain a single replica.
  bot:
    image: ghcr.io/croffasia/itsaplan-bot:1.13.0@sha256:a7bfe8d61e2e04aea38ec057969906f6278d5acac1bf40882890fccf082018de
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://itsaplan:${APP_ITSAPLAN_POSTGRES_PASSWORD}@yakitori-itsaplan_postgres_1:5432/itsaplan
      APP_ENCRYPTION_KEY: ${APP_ITSAPLAN_ENCRYPTION_KEY}

  web:
    image: ghcr.io/croffasia/itsaplan-web:1.13.0@sha256:de5f57c2a4edc7aa662081858f6f9fb376943b2d92b0a099c7a5dad91d890578
    restart: on-failure
    init: true
    stop_grace_period: 1m
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      # Absolute same-origin API URL. A relative value breaks the MCP setup
      # page (new URL(MCP_URL)) and produces unusable external client configs.
      # Keep this equal to the API service's configured API_URL; that value
      # already includes the external /api prefix.
      API_URL: ${APP_ITSAPLAN_API_URL}
      # Server-side media and calendar proxying still uses the internal API.
      SERVICE_URL_API: http://yakitori-itsaplan_api_1:3000
      PRIVACY_URL: ""
      TERMS_URL: ""
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
