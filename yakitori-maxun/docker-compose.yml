# Maxun 0.1.0 (backend, frontend, and Playwright browser service), adapted for
# umbrelOS 2.0+:
#   1. nginx merges the frontend, backend, Socket.IO, and screenshot storage
#      into one HTTPS origin, following upstream's own reverse-proxy layout.
#      The frontend image bakes its backend URL in at start-up; it is set to
#      the empty string so every API and Socket.IO call is same-origin and
#      works from <device>.local, a Tailscale IP, or a .ts.net name alike.
#   2. Run screenshots are stored in MinIO with an absolute URL (the frontend
#      only renders values that start with "http"). They are served read-only
#      under /files, and nginx rewrites the stored canonical origin to the
#      origin of each request so they load from any hostname.
#   3. Only the API-key-authenticated REST API (/api) and unguessable,
#      read-only run screenshot URLs bypass Umbrel's login; the UI, Socket.IO,
#      Swagger UI, and account endpoints stay behind it.
#   4. The browser service runs Chromium with --no-sandbox, so upstream's
#      SYS_ADMIN capability and unconfined seccomp profile are not needed.
#      Its Playwright endpoint has no authentication in this release (anyone
#      who can reach it controls the browser), so it lives on a private
#      network shared only with the backend instead of umbrel_main_network.
#      Other apps cannot reach it, and robots cannot reach other apps'
#      containers. It keeps normal outbound internet access.
#   5. Upstream's minio/minio image is no longer published; the
#      community-maintained pgsty/minio drop-in build is used instead.
#   6. PostgreSQL and MinIO persist under APP_DATA_DIR/data. Secrets are
#      derived from the Umbrel seed in exports.sh. PostHog usage telemetry is
#      disabled.
#   7. The backend runs node directly and stops on SIGINT, the only signal its
#      shutdown handler listens for, so interrupted runs are recorded as
#      failed with their partial data instead of being killed mid-write.
#   8. All images are pinned to release tags and multi-arch (amd64 + arm64)
#      digests.

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-maxun_router_1
      APP_PORT: 80
      # The REST API (robots, runs, SDK, crawl, search, extract) authenticates
      # every route with Maxun's own x-api-key and is called by SDKs, the
      # Maxun CLI/MCP server, n8n, and scripts that cannot complete Umbrel's
      # login. Run screenshots are public-read upstream and keyed by run UUID;
      # API clients receive their URLs in run results.
      # The bare bucket path is not whitelisted on purpose: the router answers
      # 404 for it, so it has nothing to serve without a login either.
      PROXY_AUTH_WHITELIST: "/api,/api/*,/files/maxun-run-screenshots/*"
      # PROXY_TIMEOUT is left unset: the gateway then never times out, which
      # synchronous API runs, LLM extraction, and Socket.IO streams need. The
      # router below still caps upstream reads at one hour.

  # Single-origin entry point. Inlined (NGINX_CONF) rather than bind-mounted
  # from the app folder so Umbrel app updates reliably apply config changes.
  router:
    image: nginx:1.30.8-alpine@sha256:8eb04fe3b385090e9aa02961f77398ad09b6bf33ab07f6669a5bb7acce22c0d3
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - printf '%s' "$$NGINX_CONF" > /etc/nginx/conf.d/default.conf && exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      NGINX_CONF: |
        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ''      close;
        }

        # Umbrel's gateway always sets X-Forwarded-Proto (https behind its
        # HTTPS ingress). Only the two literal values are accepted because the
        # result is written into JSON responses below.
        map $$http_x_forwarded_proto $$maxun_proto {
            https   https;
            default http;
        }

        server {
            listen 80 default_server;
            server_name _;

            # Document robots accept uploads up to 10 MB; recorded workflows
            # are posted as JSON.
            client_max_body_size 64m;
            absolute_redirect off;
            port_in_redirect off;

            # Resolve Docker names per request, including after a container
            # recreation, and let nginx start before the backends resolve.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $$maxun_backend yakitori-maxun_backend_1:8080;
            set $$maxun_web yakitori-maxun_web_1:5173;
            set $$maxun_minio yakitori-maxun_minio_1:9000;

            location = /health {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            # Socket.IO: recorder screencast, run progress, and queue events.
            location /socket.io/ {
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$maxun_proto;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_pass http://$$maxun_backend;
            }

            # Backend routes, as in upstream's nginx layout. /proxy is also a
            # frontend page, so only /proxy/... goes to the backend (below).
            location ~ ^/(api|api-docs|auth|record|storage|workflow|webhook)(/|$$) {
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$maxun_proto;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;

                # Screenshot URLs are stored with the canonical
                # https://<device>.local:<port> origin. Rewrite them to the
                # origin of this request (Tailscale IP, .ts.net name, ...).
                proxy_set_header Accept-Encoding "";
                sub_filter_types application/json;
                sub_filter_once off;
                sub_filter '${APP_MAXUN_PUBLIC_URL}/files/' '$$maxun_proto://$$http_host/files/';

                proxy_pass http://$$maxun_backend;
            }

            # The frontend's proxy settings page. Without this exact match nginx
            # would 301 /proxy to /proxy/ (the backend) on a page reload.
            location = /proxy {
                proxy_set_header Host $$http_host;
                proxy_set_header X-Forwarded-Proto $$maxun_proto;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_pass http://$$maxun_web;
            }

            location ^~ /proxy/ {
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$maxun_proto;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_read_timeout 300s;
                proxy_pass http://$$maxun_backend;
            }

            # Read-only run screenshots from MinIO. Only the public-read
            # screenshots bucket is exposed (documents stay internal), only
            # GET/HEAD are allowed, and query strings and credentials are
            # dropped so no other S3 operation can be reached.
            location ^~ /files/maxun-run-screenshots/ {
                limit_except GET {
                    deny all;
                }
                proxy_set_header Host $$maxun_minio;
                proxy_set_header Authorization "";
                proxy_set_header Cookie "";
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                rewrite ^/files(/maxun-run-screenshots/.+)$$ $$1? break;
                # Bare bucket path (would be a listing): never forwarded.
                return 404;
                proxy_pass http://$$maxun_minio;
            }

            location = /files {
                return 404;
            }

            location ^~ /files/ {
                return 404;
            }

            # Single-page frontend.
            location / {
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$maxun_proto;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_pass http://$$maxun_web;
            }
        }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: maxun
      POSTGRES_PASSWORD: ${APP_MAXUN_DB_PASSWORD}
      POSTGRES_DB: maxun
    volumes:
      # PostgreSQL 18+ images keep PGDATA in /var/lib/postgresql/18/docker,
      # so the parent directory is mounted (as upstream now does).
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxun -d maxun"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # S3-compatible storage for run screenshots and uploaded documents. Never
  # published directly; the router serves the screenshots bucket read-only.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: on-failure
    stop_grace_period: 30s
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: maxun
      MINIO_ROOT_PASSWORD: ${APP_MAXUN_MINIO_SECRET}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Headless Chromium (Playwright server with the stealth plugin) that robots
  # and the recorder drive. Only on the private `browser` network (see below).
  browser:
    image: getmaxun/maxun-browser:v0.0.2@sha256:8d78aff8d2d28d0fcefb9609c8326ccceb495149b4f79b6e178f5df2f0d24271
    restart: on-failure
    # Chromium leaves renderer and zygote processes behind; init reaps them.
    init: true
    stop_grace_period: 30s
    shm_size: 2gb
    environment:
      NODE_ENV: production
      BROWSER_WS_PORT: 3001
      BROWSER_HEALTH_PORT: 3002
      # The health endpoint hands the backend this host in the CDP WebSocket URL.
      BROWSER_WS_HOST: yakitori-maxun_browser_1
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    networks:
      - browser
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: getmaxun/maxun-backend:v0.1.0@sha256:c2d43bf2089a71a24b9162dcebaec0e5e47f727fdcef9d7135625d471ac58f51
    restart: on-failure
    init: true
    stop_grace_period: 1m
    # The backend creates its tables once on start and swallows connection
    # errors, so it must not start before PostgreSQL accepts connections.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      browser:
        condition: service_healthy
    # Upstream runs `npm run server` (npm -> sh -> cross-env -> node). Running
    # node directly under init lets SIGINT reach the shutdown handler.
    command: ["node", "server/dist/server/src/server.js"]
    stop_signal: SIGINT
    # Joins the app network (router, PostgreSQL, MinIO, Ollama) and the
    # private browser network.
    networks:
      - default
      - browser
    # Lets OLLAMA_BASE_URL point at an Ollama server on the Umbrel host itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096
      BACKEND_PORT: 8080
      # Canonical origin, used as the CORS origin and for OAuth return URLs.
      PUBLIC_URL: ${APP_MAXUN_PUBLIC_URL}
      JWT_SECRET: ${APP_MAXUN_JWT_SECRET}
      SESSION_SECRET: ${APP_MAXUN_SESSION_SECRET}
      # 64-hex AES-256 key for stored proxy credentials and API secrets.
      ENCRYPTION_KEY: ${APP_MAXUN_ENCRYPTION_KEY}
      DB_HOST: yakitori-maxun_postgres_1
      DB_PORT: 5432
      DB_NAME: maxun
      DB_USER: maxun
      DB_PASSWORD: ${APP_MAXUN_DB_PASSWORD}
      MINIO_ENDPOINT: yakitori-maxun_minio_1
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: maxun
      MINIO_SECRET_KEY: ${APP_MAXUN_MINIO_SECRET}
      # Base of the screenshot URLs stored with each run. The router rewrites
      # this default to the requesting origin; a user override (app settings)
      # is served as-is.
      MINIO_PUBLIC_URL: ${APP_MAXUN_PUBLIC_URL}/files
      # The backend reads the CDP WebSocket URL from the browser's /health.
      BROWSER_WS_HOST: yakitori-maxun_browser_1
      BROWSER_HEALTH_PORT: 3002
      # Upstream's default is to send PostHog usage events; keep it off.
      MAXUN_TELEMETRY: "false"
      # Fallback LLM settings for AI extraction when a robot has none of its
      # own. Defaults to the Ollama app from the Umbrel App Store.
      OLLAMA_BASE_URL: http://ollama_ollama_1:11434
      ALLOW_PRIVATE_WEBHOOK_URLS: "false"
    # Note for future updates: the backend only creates missing tables on
    # start (sequelize sync without alter); schema changes in later releases
    # need a one-shot `npm run migrate` service gated before it.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    image: getmaxun/maxun-frontend:v0.1.0@sha256:aa00ccdbc3851a1211a5212d7775c1d50af2c46de1c337a8dafeb1a3a7c995f9
    restart: on-failure
    init: true
    stop_grace_period: 15s
    # Upstream's start command substitutes the backend URL into the built
    # bundle but cannot set it to empty. An empty value makes every request
    # and Socket.IO connection relative to the page's own origin.
    command:
      - sh
      - -c
      - |
        grep -rl '__VITE_BACKEND_URL__' build | xargs -r sed -i 's|__VITE_BACKEND_URL__||g'
        exec serve -s build -l 5173
    environment:
      NO_UPDATE_CHECK: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# Private bridge network for the browser service and the backend only. Not
# `internal`: Chromium needs outbound internet access to scrape. Docker drops
# traffic between bridge networks, so containers on umbrel_main_network (every
# other app) cannot reach the unauthenticated Playwright endpoint, and pages
# the browser loads cannot reach other apps' containers.
# yakitori-allow: compose.networks isolates the unauthenticated Playwright browser endpoint from other apps
networks:
  browser: {}
