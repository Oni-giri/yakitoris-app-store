manifestVersion: 2.0
id: yakitori-maxun
storage:
  dataRoot: data
category: developer
name: Maxun
version: "0.1.0-umbrel.1"
tagline: Turn any website into a structured API with no-code and AI robots
icon: https://avatars.githubusercontent.com/u/139582646?s=512&v=4
description: >-
  Maxun is an open-source web data platform for scraping, crawling, searching,
  and extracting data from websites. Build robots visually by recording your
  clicks in a remote browser, describe what you want in plain English with an
  LLM, or turn pages into LLM-ready Markdown, HTML, text, links, and
  screenshots. Robots handle pagination, infinite scroll, and JavaScript-heavy
  sites, run on demand or on a schedule, and deliver results through the REST
  API, webhooks, or CSV/JSON export.


  This package runs Maxun's backend, frontend, and headless Chromium browser
  service alongside PostgreSQL and MinIO on your Umbrel, with per-device
  secrets and PostHog usage telemetry turned off.


  🛠️ SET-UP INSTRUCTIONS


  Open the app and choose **Register** to create your account, then generate an
  API key from the **API Key** page.


  AI features: a robot can carry its own LLM provider, model, and key. As a
  fallback, set `OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, or `OLLAMA_BASE_URL` in
  this app's settings; Ollama defaults to the Ollama app from the Umbrel App
  Store, so install it and pull a model to extract with local models.


  🤖 AI ASSISTANTS


  Agents and scripts call the REST API with Maxun's `x-api-key` header: from
  another app on this Umbrel at `http://yakitori-maxun_router_1/api/...`, or
  from your network at `https://<device>.local:8767/api/...` (plain `http://`
  works on the same port for clients that do not trust Umbrel's certificate).
  Point the Node.js and Python SDKs at `https://<device>.local:8767/api/sdk/`
  (`MAXUN_BASE_URL`) and Maxun's MCP server at `https://<device>.local:8767`
  (`BACKEND_URL`). Swagger docs are at `/api-docs`. An API key has full
  access to its account's robots and runs, so give agents their own Maxun
  account and revoke the key from the **API Key** page if it leaks.


  ⚠️ GOOD TO KNOW


  umbrelOS 2.0 or newer is required. The web interface stays behind Umbrel's
  login; only the REST API under `/api` (authenticated by Maxun's API key) and
  run screenshots under `/files` (unguessable, read-only, run-specific URLs
  that also open without a login upstream) bypass it. Do not forward this
  app's port to the internet.


  Robots browse from your Umbrel, so they can open anything on your home
  network (router, NAS, printers) and Umbrel apps whose login is turned off.
  The browser runs on a private network that other apps cannot reach and that
  cannot reach other apps' containers. Webhooks to private or Tailscale
  addresses (such as n8n on this Umbrel) are blocked unless you enable
  `ALLOW_PRIVATE_WEBHOOK_URLS`.


  Screenshot links stored with each run use `https://<device>.local:8767`;
  the app shows them from whichever address you open it on, but links sent in
  webhooks keep that address, and renaming the device breaks older ones. Set
  `MINIO_PUBLIC_URL` to pin another address. Maxun Cloud extras such as
  managed anti-bot proxies, CAPTCHA solving, and auto robots are not part of
  the open-source edition; you can add your own proxy on the **Proxy** page.
releaseNotes: >-
  Hardens the browser service and fixes shutdown. Maxun's headless browser now
  runs on a private network: other Umbrel apps can no longer reach its
  unauthenticated control endpoint, and robots can no longer open other apps'
  internal services. The backend now shuts down cleanly when the app stops, so
  interrupted runs are marked failed and keep their partial data. Adds settings
  for the document-robot Ollama model and the screenshot link address, removes
  the one-hour gateway timeout, and corrects the OpenAI, Ollama, and webhook
  setting descriptions.
developer: Maxun
website: https://maxun.dev
dependencies: []
repo: https://github.com/getmaxun/maxun
support: https://github.com/getmaxun/maxun/issues
port: 8767
requiresHttps: true
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
environment:
  - name: OPENAI_API_KEY
    services:
      - backend
    note: >-
      Optional OpenAI key used by AI extraction when a robot has no key of its
      own. It stays on the server and is only sent to api.openai.com or to
      OPENAI_BASE_URL.
  - name: OPENAI_BASE_URL
    services:
      - backend
    note: >-
      Optional OpenAI-compatible endpoint (for example LM Studio or vLLM) that
      may also receive OPENAI_API_KEY when a robot uses exactly this base URL.
      It does not change the default endpoint, which stays api.openai.com.
  - name: ANTHROPIC_API_KEY
    services:
      - backend
    note: >-
      Optional Anthropic key used by AI extraction and document robots when a
      robot has no key of its own.
  - name: OLLAMA_BASE_URL
    default: "http://ollama_ollama_1:11434"
    services:
      - backend
    note: >-
      Ollama server used when a robot does not set its own. Defaults to the
      Umbrel Ollama app; use http://host.docker.internal:11434 for an Ollama
      on the host, or https://ollama.com for Ollama Cloud.
  - name: OLLAMA_MODEL
    services:
      - backend
    note: >-
      Optional default Ollama model for AI extraction robots, such as llama3.2
      or qwen3. It must already be pulled on the Ollama server.
  - name: OLLAMA_DEFAULT_MODEL
    default: "llama3.2:latest"
    services:
      - backend
    note: >-
      Ollama model used by document robots (PDF, DOCX, images) when they have
      none of their own. Defaults to llama3.2:latest, which must be pulled on
      the Ollama server.
  - name: OLLAMA_API_KEY
    services:
      - backend
    note: >-
      Optional API key for Ollama Cloud (https://ollama.com). Not needed for a
      local Ollama.
  - name: ALLOW_PRIVATE_WEBHOOK_URLS
    default: "false"
    options:
      - "false"
      - "true"
    services:
      - backend
    note: >-
      Set to true to let webhooks reach private, loopback, and Tailscale
      (100.64.0.0/10) addresses, such as n8n on this Umbrel. This only affects
      webhooks, not which pages robots can open.
  - name: MINIO_PUBLIC_URL
    services:
      - backend
    note: >-
      Base address stored in new run screenshot links, ending in /files. Leave
      unset for https://<device>.local:8767/files, or pin another address such
      as https://100.x.y.z:8767/files. Existing links are not changed.
submitter: Yakitori
submission: https://github.com/Oni-giri/yakitoris-app-store
