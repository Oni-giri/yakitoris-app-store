# mcpspan 0.16.0 (TimescaleDB, Core API, and Next.js dashboard), adapted for
# umbrelOS 2.0+:
#   1. One port instead of upstream's two. nginx serves the dashboard and the
#      Core API's public routes from the same origin, so the dashboard, SDK
#      ingest, /mcp, badges, and OAuth all live at <device>.local:6270. Umbrel
#      answers that port over HTTPS (the dashboard's copy buttons need a secure
#      context) and plain HTTP (for SDKs and agents that do not trust Umbrel's
#      local certificate authority).
#   2. Only what MCP servers and agents call bypasses Umbrel's login: event
#      ingest (POST /v1/events, API key), read-token API reads (GET
#      /v1/dashboard/*, /v1/servers), the /mcp server, enabled badges, and the
#      OAuth discovery/registration/token/revoke endpoints. The Core API
#      authenticates each of them itself. Sign-in, account, server, key,
#      token, and alert routes are not published at all: the dashboard reaches
#      them over the app network, as upstream intends.
#   3. The API key signing secret and database password are derived per device
#      in exports.sh, instead of upstream's secret file on its own volume.
#   4. TimescaleDB persists under APP_DATA_DIR/data/db. Its telemetry is off,
#      and its first-boot auto-tuning assumes 1 GB of RAM instead of sizing
#      shared buffers to the whole Umbrel.
#   5. Schema migrations run once, to completion, before the API starts
#      (upstream's migrate service).
#   6. All images are pinned to release tags and multi-architecture
#      (amd64 + arm64) digests.

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-mcpspan_router_1
      APP_PORT: 80
      # MCP servers, SDKs, the proxy, mcpspan-mcp, and MCP clients cannot
      # complete Umbrel's login page; they authenticate with mcpspan API keys,
      # read tokens, or OAuth tokens. Exact paths plus /* so a bare prefix probe
      # gets mcpspan's JSON answer instead of a 302 to Umbrel's login.
      PROXY_AUTH_WHITELIST: "/v1/events,/v1/servers,/v1/dashboard/*,/mcp,/mcp/*,/badge/*,/.well-known/oauth-authorization-server,/.well-known/oauth-authorization-server/*,/.well-known/oauth-protected-resource,/.well-known/oauth-protected-resource/*,/.well-known/openid-configuration,/oauth/register,/oauth/token,/oauth/revoke"
      # Keep MCP streams and large CSV/NDJSON exports open (milliseconds).
      PROXY_TIMEOUT: 3600000

  # Single-origin entry point. Inlined (NGINX_CONF) rather than bind-mounted
  # from the app folder so Umbrel app updates reliably apply config changes.
  router:
    image: nginx:1.30.8-alpine@sha256:8eb04fe3b385090e9aa02961f77398ad09b6bf33ab07f6669a5bb7acce22c0d3
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - printf '%s' "$$NGINX_CONF" > /etc/nginx/conf.d/default.conf && exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      NGINX_CONF: |
        # Umbrel's gateway sets X-Forwarded-Proto (https behind its HTTPS
        # ingress). mcpspan marks session cookies Secure and builds its OAuth
        # metadata from it, so only the two literal values are passed on.
        map $$http_x_forwarded_proto $$mcpspan_proto {
            https   https;
            default http;
        }

        server {
            listen 80 default_server;
            server_name _;

            # The API refuses batches over 4 MB itself; leave it room to say so.
            client_max_body_size 8m;
            absolute_redirect off;
            port_in_redirect off;

            # Resolve Docker names per request, including after a container
            # recreation, and let nginx start before the backends resolve.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $$mcpspan_api yakitori-mcpspan_api_1:6271;
            set $$mcpspan_dashboard yakitori-mcpspan_dashboard_1:6270;

            # The Host header is kept so the API's OAuth metadata, /mcp
            # resource, and badge links name the address the client used.
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$mcpspan_proto;

            # A method refused below (limit_except) answers in JSON, like
            # everything else the API says. Upstream errors pass through as-is.
            error_page 403 = @method_not_allowed;
            location @method_not_allowed {
                default_type application/json;
                return 405 '{"error":"Method not allowed"}';
            }

            # Liveness of the router and the API (not exposed past Umbrel's login).
            location = /health {
                access_log off;
                proxy_pass http://$$mcpspan_api;
            }

            # SDK and mcpspan-proxy telemetry, authenticated by API key.
            location = /v1/events {
                limit_except POST {
                    deny all;
                }
                proxy_pass http://$$mcpspan_api;
            }

            # Read tokens only ever read: the API refuses anything but GET
            # with one, and nothing else needs these routes from outside.
            location = /v1/servers {
                limit_except GET {
                    deny all;
                }
                proxy_pass http://$$mcpspan_api;
            }

            location ^~ /v1/dashboard/ {
                limit_except GET {
                    deny all;
                }
                # Exports are streamed.
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_pass http://$$mcpspan_api;
            }

            # Sign-in, accounts, servers and keys, tokens, alerts, and OAuth
            # consent are for the dashboard, which calls the API directly.
            location ^~ /v1/ {
                default_type application/json;
                return 404 '{"error":"Not found"}';
            }

            # mcpspan's own MCP server: read tokens or OAuth sign-in.
            location = /mcp {
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_pass http://$$mcpspan_api;
            }

            location ^~ /mcp/ {
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_pass http://$$mcpspan_api;
            }

            # README badges, off per server until switched on in Settings.
            location ^~ /badge/ {
                limit_except GET {
                    deny all;
                }
                proxy_pass http://$$mcpspan_api;
            }

            # OAuth for /mcp: discovery, registration, tokens, and revocation
            # are the API's; the consent page (/oauth/authorize) is the
            # dashboard's and stays behind Umbrel's login. OpenID discovery is
            # not served, and is answered by the API's JSON 404.
            location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration)(/|$$) {
                proxy_pass http://$$mcpspan_api;
            }

            location ~ ^/oauth/(register|token|revoke)$$ {
                proxy_pass http://$$mcpspan_api;
            }

            # The dashboard, including its own /api routes and /oauth/authorize.
            location / {
                proxy_pass http://$$mcpspan_dashboard;
            }
        }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: timescale/timescaledb:2.30.1-pg17@sha256:c79fa5891443d1cdf6de5258d4c2bdb8cde29052c45df2062b13d351e0202005
    restart: on-failure
    stop_grace_period: 1m
    # Parallel queries over large hypertables use dynamic shared memory in
    # /dev/shm, which Docker caps at 64 MB by default.
    shm_size: 256mb
    # The image's init script only switches telemetry off on first boot; the
    # flag here keeps it off for every start.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: mcpspan
      POSTGRES_PASSWORD: ${APP_MCPSPAN_DB_PASSWORD}
      POSTGRES_DB: mcpspan
      TIMESCALEDB_TELEMETRY: "off"
      # timescaledb-tune runs once, on the first boot, and would otherwise size
      # shared_buffers and work_mem to the whole machine's RAM.
      TS_TUNE_MEMORY: 1GB
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, as the other services connect: on a fresh volume the image
      # first runs a socket-only server, and migrate would be refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mcpspan -d mcpspan"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Schema changes run once, to completion, before anything serves a request.
  # node-pg-migrate takes a lock and runs each migration in a transaction, so
  # retrying after a failure is safe.
  migrate:
    image: ghcr.io/mcpspan/core-api:0.16.0@sha256:10aafb6a8cd7188d90d743000f5740e299c9d5a281e524a075d83c6c90c156c8
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mcpspan:${APP_MCPSPAN_DB_PASSWORD}@yakitori-mcpspan_db_1:5432/mcpspan
    command: ["./node_modules/.bin/node-pg-migrate", "up"]

  api:
    image: ghcr.io/mcpspan/core-api:0.16.0@sha256:10aafb6a8cd7188d90d743000f5740e299c9d5a281e524a075d83c6c90c156c8
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://mcpspan:${APP_MCPSPAN_DB_PASSWORD}@yakitori-mcpspan_db_1:5432/mcpspan
      PORT: 6271
      # Signs API keys. Changing it would invalidate every key ever issued.
      API_KEY_SECRET: ${APP_MCPSPAN_API_KEY_SECRET}
      # Where MCP clients signing in to /mcp are sent to allow them. Setting it
      # is also what switches OAuth sign-in on. Overridable in app settings.
      MCPSPAN_DASHBOARD_URL: ${APP_MCPSPAN_DASHBOARD_URL}
      # Upstream's defaults, set here so the app settings show real values.
      # Values below the 8-day minimum are refused and logged, not applied.
      MCPSPAN_RETENTION_DAYS: "90"
      MCPSPAN_ROLLUP_RETENTION_DAYS: "730"
      # OpenTelemetry forwarding stays off until OTEL_EXPORTER_OTLP_ENDPOINT is
      # set in the app's settings.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6271/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dashboard:
    image: ghcr.io/mcpspan/core-dashboard:0.16.0@sha256:4c1d5e8b88f01f57750224b2db8626932acbecee1f66775cb771f45001db5cc0
    restart: on-failure
    init: true
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side only: the browser never talks to the Core API directly.
      CORE_API_URL: http://yakitori-mcpspan_api_1:6271
      # The address printed in setup snippets, the /mcp address, and badge
      # links. Plain HTTP by default because MCP servers and agents do not
      # trust Umbrel's local certificate authority. Overridable in app settings.
      MCPSPAN_INGEST_URL: ${APP_MCPSPAN_INGEST_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6270/login').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
