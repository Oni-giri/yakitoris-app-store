version: "3.7"

# Alexandrie packaged for Umbrel.
#
# Adapted from the upstream compose at
# https://github.com/Smaug6739/Alexandrie/blob/v8.14.3/docker-compose.yml
#
# Umbrel-specific changes:
#
#   1. ONE ORIGIN. Upstream publishes the frontend (:8200), the API (:8201) and
#      the S3 file host (:9000) as three separate browser-facing URLs. Umbrel
#      exposes a single port per app, so nginx (nginx/default.conf.template)
#      serves all three from one origin: /api -> backend, /alexandrie/ ->
#      RustFS, everything else -> frontend. The frontend is given empty base
#      URLs so it calls /api and /alexandrie/ relative to whatever hostname
#      you opened it on (umbrel.local, IP, Tailscale...).
#
#   2. NETWORKING. Every Umbrel app shares one Docker network, so bare service
#      names like "mysql" collide with other apps. Internal services are
#      addressed by their unique container names "<app-id>_<service>_1".
#
#   3. STORAGE. Named volumes are replaced by bind mounts under
#      ${APP_DATA_DIR}; hooks/pre-start creates them with the right owners.
#
#   4. SECRETS. Database, S3 and JWT secrets are derived from ${APP_SEED}, so
#      they are unique to this Umbrel and stable across restarts.

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-alexandrie_web_1
      APP_PORT: 80

  # ---- Single-origin reverse proxy ------------------------------------------
  web:
    image: nginx:1.30-alpine@sha256:e9b2d7624fd7957f4ed44ae0a272d93fb73aeb8512ba8916f8118ae6143fd115
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - frontend
      - backend
      - rustfs
    environment:
      # Substituted into the template by the nginx image's entrypoint. Must
      # match the host in MINIO_PUBLIC_URL so presigned backup links verify.
      PUBLIC_HOST: ${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
    volumes:
      - ${APP_DATA_DIR}/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  # ---- Nuxt frontend (:8200) -------------------------------------------------
  frontend:
    image: ghcr.io/smaug6739/alexandrie-frontend:v8.14.3@sha256:c909df27cfa648b2ce66cce1e84ea13b203e30f5f13254d869394d255d8e10a7
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 8200
      NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: "false"
      # Open straight to the app instead of the marketing landing page.
      NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: "true"
      # Empty = same origin as the page (see note 1).
      NUXT_PUBLIC_BASE_API: ""
      NUXT_PUBLIC_BASE_CDN: ""
      NUXT_PUBLIC_CDN_ENDPOINT: /alexandrie/
      NUXT_PUBLIC_BASE_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}

  # ---- Go API (:8201) --------------------------------------------------------
  backend:
    image: ghcr.io/smaug6739/alexandrie-backend:v8.14.3@sha256:811878c3f4e34595371d242ec99569794e23bee70a15b71a2814bafd3aa3521d
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      BACKEND_PORT: 8201
      GIN_MODE: release

      JWT_SECRET: ${APP_SEED}
      # Empty = host-only cookies, valid on whatever hostname you use.
      COOKIE_DOMAIN: ""
      # Only used for CORS and links in emails. Same-origin requests through
      # nginx are accepted regardless of hostname.
      FRONTEND_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      # Umbrel serves apps over plain HTTP on the LAN.
      ALLOW_UNSECURE: "true"

      CONFIG_DISABLE_SIGNUP: "false"
      CONFIG_DISABLE_NATIVE_LOGIN: "false"

      DATABASE_HOST: yakitori-alexandrie_mysql_1
      DATABASE_PORT: 3306
      DATABASE_NAME: alexandrie
      DATABASE_USER: alexandrie
      DATABASE_PASSWORD: ${APP_SEED}

      MINIO_ENDPOINT: yakitori-alexandrie_rustfs_1:9000
      MINIO_PUBLIC_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      MINIO_SECURE: "false"
      MINIO_INSECURE_TLS: "false"
      MINIO_ACCESSKEY: alexandrie
      MINIO_SECRETKEY: ${APP_SEED}
      MINIO_BUCKET: alexandrie

      # Only needed for password-reset emails.
      SMTP_HOST: ""
      SMTP_MAIL: ""
      SMTP_MAIL_FROM: ""
      SMTP_PASSWORD: ""

  # ---- MySQL -----------------------------------------------------------------
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: on-failure
    stop_grace_period: 1m
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_SEED}
      MYSQL_DATABASE: alexandrie
      MYSQL_USER: alexandrie
      MYSQL_PASSWORD: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u alexandrie -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---- RustFS (S3-compatible storage for uploads and backups) ---------------
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    environment:
      RUSTFS_ACCESS_KEY: alexandrie
      RUSTFS_SECRET_KEY: ${APP_SEED}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_LOG_LEVEL: error
    volumes:
      - ${APP_DATA_DIR}/data/rustfs:/data
      - ${APP_DATA_DIR}/data/rustfs-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
