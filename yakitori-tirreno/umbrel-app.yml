id: yakitori-tirreno
category: developer
name: tirreno
version: "0.10.1-umbrel.3"
tagline: In-app security — event tracking, risk scoring and threat detection
icon: https://raw.githubusercontent.com/Oni-giri/yakitoris-app-store/master/yakitori-tirreno/icon-white.svg
description: >-
  tirreno is a self-hosted security framework that watches what happens *inside*
  your application instead of at the network edge. Apps post events to it
  (logins, page views, searches, field edits) and it scores each user, agent or
  API key against a rule engine, surfacing account takeover, scraping, business
  logic abuse and compromised non-human identities.


  🛠️ SET-UP INSTRUCTIONS


  Open the app and go to **/signup** to create your admin account — signup closes
  after the first account exists, so it is the only one you get. You will also
  name the first API key; that key is what your applications authenticate with.


  Sending events: the dashboard shows your ingest URL,
  `http://<this-host>:8585/sensor/`. Post form-encoded events with the key in an
  `Api-Key` header. Official trackers exist for Node.js, Python, PHP and
  WordPress, and plain `curl` works too. Each API key has its own event stream
  and Logbook, so create one per source.


  ⚠️ REMOTE SOURCES


  If a VPS or another machine has to report events, put both ends on your
  tailnet (the Tailscale app on this Umbrel already does that) and post to
  `http://<this-umbrel's-tailnet-name>:8585/sensor/`. Do not port-forward this
  app: it stores IP addresses, emails and names.


  Enrichment (VPN/Tor flags, breach data, cross-install profile counts) is
  opt-in and stays fully offline until you add an enrichment key from tirreno.


  Do not delete `app-data/yakitori-tirreno/data/config` — it holds the password
  pepper, and losing it invalidates every stored password hash.
