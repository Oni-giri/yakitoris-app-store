releaseNotes: >-
  Fixes two faults found on first install: the database container ran as an
  unprivileged uid, so Postgres exited before initialising, and the database
  service was called `db`, which collides with every other app's `db` on
  Umbrel's shared network and routed connections to the wrong database. It is
  now `tirreno_db`. The icon is a mask-free SVG in white on the brand navy tile.


  Runs the upstream image unmodified: Apache serves the dashboard and the ingest
  endpoint, and the image's own cron daemon runs tirreno's job queue every 10
  minutes, so risk scores, totals and retention need no extra container.


  The web installer is removed at start-up; the schema is created from the
  database URL on first boot instead, and the database password is generated
  per-device under `secrets/` rather than stored in the compose file.
