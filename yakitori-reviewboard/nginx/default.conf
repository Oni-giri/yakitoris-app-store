# Nginx front-end for Review Board on Umbrel.
#
# Adapted from Review Board's official Docker example
# (reviewboard/reviewboard: contrib/docker/examples/nginx_templates). Simplified
# for Umbrel: a single default server on :80 with a wildcard name, since the
# Umbrel app_proxy already fronts this with authentication. Static media is
# served directly from the shared site directory; everything else is proxied to
# the Review Board backend.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/reviewboard/htdocs;

    # Resolve the backend at request time via Docker's embedded DNS (127.0.0.11)
    # rather than once at startup, so we survive the backend container getting a
    # new IP across restarts. The backend is addressed by its unique container
    # name because all Umbrel apps share one network and "reviewboard" alone is
    # not guaranteed unique.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $rb_backend "yakitori-reviewboard_reviewboard_1:8080";
        proxy_pass http://$rb_backend;
        proxy_redirect off;

        # Forward the FULL Host header including the port ($http_host), not $host
        # (which drops the port). Review Board is reached on :8087, and Django's
        # CSRF origin check compares the request's Host against the browser Origin
        # "http://<host>:8087"; using $host would yield "http://<host>" and every
        # login POST would fail CSRF. With $http_host it stays same-origin for any
        # hostname or LAN IP, so no CSRF_TRUSTED_ORIGINS list is needed.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl off;

        client_max_body_size        10m;
        client_body_buffer_size     128k;
        proxy_connect_timeout       90;
        proxy_send_timeout          90;
        proxy_read_timeout          90;
        proxy_headers_hash_max_size 512;
        proxy_buffer_size           4k;
        proxy_buffers               4 32k;
        proxy_busy_buffers_size     64k;
        proxy_temp_file_write_size  64k;
    }

    location /media/ {
        alias /var/www/reviewboard/htdocs/media/;
        expires max;
        add_header Cache-Control public;
    }

    location /static/ {
        alias /var/www/reviewboard/htdocs/static/;
        expires max;
        add_header Cache-Control public;
    }

    location /errordocs/ {
        alias /var/www/reviewboard/htdocs/errordocs/;
        expires 5d;
    }

    location /robots.txt {
        alias /var/www/reviewboard/htdocs/robots.txt;
        expires 5d;
    }
}
