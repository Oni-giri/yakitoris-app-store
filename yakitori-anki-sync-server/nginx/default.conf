# Front door for Anki Sync Server on Umbrel.
#
# The official anki-sync-server only speaks the Anki protocol at /sync and
# /msync (plus GET /health). GET / is 404, so Umbrel's Open button looks
# broken. Nginx serves a status/setup page at / and reverse-proxies the
# protocol paths to the sync server.
#
# The backend is addressed by its unique container name because every Umbrel
# app shares one Docker network. Resolve it at request time via Docker DNS
# so this container survives the backend getting a new IP across restarts.

server {
    listen 80 default_server;
    server_name _;

    # Anki collections and media can be hundreds of MB. 0 = unlimited.
    client_max_body_size 0;
    client_body_timeout 3600s;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $anki_upstream yakitori-anki-sync-server_server_1:8080;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html @landing;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html @landing;
    }

    # If the status page files were not copied onto the box, still never 404 /.
    location @landing {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Anki Sync Server</title></head><body><h1>Anki Sync Server</h1><p>This is a private sync server, not AnkiWeb. Review cards in the Anki app.</p><p>Point Anki at this URL (include the trailing slash). Username: anki. Password: shown in this app details in umbrelOS.</p></body></html>';
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    location / {
        proxy_pass http://$anki_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }
}
