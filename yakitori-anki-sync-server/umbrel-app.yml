manifestVersion: 1
id: yakitori-anki-sync-server
category: files
name: Anki Sync Server
version: "26.08.2"
tagline: Privately sync Anki decks across your devices
icon: https://github.com/ankitects.png
description: >-
  Anki Sync Server keeps your flashcard collection and media synchronized
  between Anki on desktop, AnkiMobile, and AnkiDroid without storing your data
  on AnkiWeb. It runs the official sync-server implementation from the Anki
  project and stores its data locally on your Umbrel.


  This is not a website. Opening it in a browser returns 404 because the
  server only speaks the Anki sync protocol (/sync and /msync). Review cards
  in the Anki app. Connect each client to http://umbrel.local:27701/ (replace
  umbrel.local with your Umbrel's hostname or Tailscale name). Sign in with
  the username "anki" and the password shown in this app's details. Include
  the trailing slash. The Local Anki Server add-on can make switching between
  AnkiWeb and this private server easier on desktop.


  The server uses unencrypted HTTP. Keep it on your trusted local network, or
  access it remotely through a private VPN such as Tailscale. Do not expose the
  port directly to the public internet.
releaseNotes: >-
  Removed the extra nginx reverse proxy. It was only there to turn the
  browser 404 at / into a status page; Anki clients never use that path.
  The official server has no web UI. Open Anki on your devices and point
  them at this app's URL instead.
developer: Ankitects Pty Ltd and contributors
website: https://apps.ankiweb.net/
dependencies: []
repo: https://github.com/ankitects/anki
support: https://docs.ankiweb.net/sync-server.html
port: 27701
gallery: []
path: ""
defaultUsername: anki
deterministicPassword: true
submitter: Yakitori
submission: ""

