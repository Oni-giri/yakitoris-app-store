manifestVersion: 1
id: yakitori-anki-sync-server
category: files
name: Anki Sync Server
version: "26.08.1"
tagline: Privately sync Anki decks across your devices
icon: https://github.com/ankitects.png
description: >-
  Anki Sync Server keeps your flashcard collection and media synchronized
  between Anki on desktop, AnkiMobile, and AnkiDroid without storing your data
  on AnkiWeb. It runs the official sync-server implementation from the Anki
  project and stores its data locally on your Umbrel.


  This is a sync server, not a website for reviewing cards. Opening the app in
  your browser shows a status page with the Sync URL and setup steps. Connect
  each Anki client to that URL (http://umbrel.local:27701/ if you use the
  default hostname). Sign in with the username "anki" and the password shown
  in this app's details. The Local Anki Server add-on can make switching
  between AnkiWeb and this private server easier on desktop.


  The server uses unencrypted HTTP. Keep it on your trusted local network, or
  access it remotely through a private VPN such as Tailscale. Do not expose the
  port directly to the public internet.
releaseNotes: >-
  Opening the app in a browser now shows a status page with connection details
  and client setup steps. The official Anki sync server has no web UI of its
  own (GET / was 404), so the previous package looked broken when opened from
  umbrelOS. Sync still uses the same URL; collection and media data remain
  under the app data directory, with payloads up to 250 MB.
developer: Ankitects Pty Ltd and contributors
