version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-anki-sync-server_server_1
      APP_PORT: 8080
      # Anki clients cannot complete Umbrel's browser login flow. The sync
      # server authenticates every sync using SYNC_USER1 instead.
      PROXY_AUTH_ADD: "false"

  server:
    # Multi-architecture image built from Anki's official sync-server source.
    image: jeankhawand/anki-sync-server:26.08@sha256:55d51cac22a33f61553af75740804553cf716fa5831cd59c76906c2a596ee9b9
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # APP_PASSWORD is generated by Umbrel and displayed in the app details.
      SYNC_USER1: "anki:${APP_PASSWORD}"
      MAX_SYNC_PAYLOAD_MEGS: "250"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ${APP_DATA_DIR}/data:/anki_data
