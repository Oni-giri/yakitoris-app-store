version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-anki-sync-server_web_1
      APP_PORT: 80
      # Anki clients cannot complete Umbrel's browser login flow. The sync
      # server authenticates every sync using SYNC_USER1 instead. The landing
      # page has no secrets; the password lives in the umbrelOS app details.
      PROXY_AUTH_ADD: "false"

  # Status/setup page at GET /, reverse-proxy of /sync /msync /health to the
  # Anki server. Needed because anki-sync-server has no web UI of its own.
  web:
    image: nginx:1.27@sha256:124b44bfc9ccd1f3cedf4b592d4d1e8bddb78b51ec2ed5056c52d3692baebc19
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - server
    volumes:
      - ${APP_DATA_DIR}/www:/usr/share/nginx/html:ro
      - ${APP_DATA_DIR}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  server:
    # Multi-architecture image built from Anki's official sync-server source.
    image: jeankhawand/anki-sync-server:26.08@sha256:55d51cac22a33f61553af75740804553cf716fa5831cd59c76906c2a596ee9b9
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # APP_PASSWORD is generated by Umbrel and displayed in the app details.
      SYNC_USER1: "anki:${APP_PASSWORD}"
      MAX_SYNC_PAYLOAD_MEGS: "250"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ${APP_DATA_DIR}/data:/anki_data

