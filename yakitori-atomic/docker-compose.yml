version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-atomic_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/kenforthewin/atomic-server:latest
    restart: on-failure
    environment:
      PUBLIC_URL: ""
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    image: ghcr.io/kenforthewin/atomic-web:latest
    restart: on-failure
    depends_on:
      server:
        condition: service_healthy
