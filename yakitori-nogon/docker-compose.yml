version: "3.7"

# Nogon packaged for Umbrel.
#
# Adapted from the upstream Docker guide at
# https://github.com/asciimoo/nogon/blob/v0.22.0/webui/website/src/content/docs/docker.md
#
# Umbrel-specific changes:
#
#   1. ANY HOSTNAME. Nogon only accepts web-UI search (/search websocket) and
#      MCP requests whose Origin matches server.base_url. Umbrel apps are
#      reached as umbrel.local, the LAN IP, a Tailscale IP or MagicDNS name,
#      so a small nginx front (the "web" service below) rewrites Origin to
#      base_url, but only for genuinely same-origin requests (Origin equal to
#      the Host the browser reached us on). Cross-site origins pass through
#      unchanged and Nogon keeps rejecting them.
#
#   2. AUTH. Nogon's access token is Umbrel's per-app password (shown on the
#      app's page because of deterministicPassword). The browser extension and
#      MCP clients cannot carry Umbrel's login cookie, so their API paths skip
#      Umbrel's login and authenticate with that token instead.
#
#   3. STORAGE. The index, SQLite database and secret key live in a bind mount
#      under ${APP_DATA_DIR}; the container runs as 1000:1000 to own it.

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-nogon_web_1
      APP_PORT: 80
      # Browser extension and MCP endpoints. Every one of them still requires
      # Nogon's access token; /api/config only reports public UI settings.
      PROXY_AUTH_WHITELIST: "/api/add,/api/add_pdf,/api/delete,/api/document,/api/history,/api/rules,/api/profile,/api/config,/api/label,/mcp"

  # ---- Origin-normalising front ---------------------------------------------
  # The nginx config is inlined (NGINX_CONF) rather than bind-mounted from the
  # app folder because Umbrel updates do not overwrite files that already
  # exist there; only docker-compose.yml is reliably replaced. In it, $$ is a
  # literal nginx $ and ${...} is filled in by Umbrel when the app starts.
  #
  # What it does:
  #   - $$nogon_origin: Origin is replaced with base_url only when it equals
  #     the Host / X-Forwarded-Host the browser reached us on (same-origin
  #     from umbrel.local, an IP, Tailscale...). Cross-site origins pass
  #     through and Nogon rejects them.
  #   - /api/config: baseUrl, wsUrl and searchUrl are rewritten from
  #     umbrel.local to the address the browser used, so the web UI talks to
  #     the host it was opened on (umbrel.local does not resolve over
  #     Tailscale away from home).
  web:
    image: nginx:1.30-alpine@sha256:e9b2d7624fd7957f4ed44ae0a272d93fb73aeb8512ba8916f8118ae6143fd115
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - server
    entrypoint:
      - /bin/sh
      - -c
      - printf '%s' "$$NGINX_CONF" > /etc/nginx/conf.d/default.conf && exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      NGINX_CONF: |
        map "$$http_origin $$http_host $$http_x_forwarded_host" $$nogon_origin {
            "~^https?://(?<oh>[^\s/]+) \k<oh> "        "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}";
            "~^https?://(?<oh>[^\s/]+) \S+ \k<oh>$$"    "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}";
            default                                     $$http_origin;
        }

        map "$$http_host|$$http_x_forwarded_host" $$client_host {
            "~^(?<h>[A-Za-z0-9.-]+(:[0-9]+)?|\[[0-9A-Fa-f:.]+\](:[0-9]+)?)\|"   $$h;
            "~\|(?<h>[A-Za-z0-9.-]+(:[0-9]+)?|\[[0-9A-Fa-f:.]+\](:[0-9]+)?)(,|$$)" $$h;
            default                                                            "${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}";
        }

        map $$http_x_forwarded_proto $$client_ws_scheme {
            "~^https"   wss;
            default     ws;
        }
        map $$http_x_forwarded_proto $$client_http_scheme {
            "~^https"   https;
            default     http;
        }

        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 80 default_server;
            server_name _;

            client_max_body_size 100m;

            resolver 127.0.0.11 valid=30s ipv6=off;
            set $$nogon yakitori-nogon_server_1:4433;

            location = /api/config {
                proxy_set_header Host $$http_host;
                proxy_set_header Origin $$nogon_origin;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header Accept-Encoding "";

                sub_filter_types application/json;
                sub_filter_once off;
                sub_filter "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}" "$$client_http_scheme://$$client_host";
                sub_filter "ws://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"   "$$client_ws_scheme://$$client_host";

                proxy_pass http://$$nogon;
            }

            location / {
                proxy_set_header Host $$http_host;
                proxy_set_header Origin $$nogon_origin;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;

                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_read_timeout 86400s;
                proxy_send_timeout 300s;
                proxy_request_buffering off;
                proxy_pass http://$$nogon;
            }
        }

  # ---- Nogon (:4433) ---------------------------------------------------------
  server:
    image: ghcr.io/asciimoo/nogon:v0.22.0@sha256:d1b427c7f876e64e6212e000df60d33c2e418b60372582b56cfee719eafd4107
    restart: on-failure
    stop_grace_period: 1m
    init: true
    user: "1000:1000"
    working_dir: /nogon/data
    environment:
      NOGON_DATA_DIR: /nogon/data
      NOGON__SERVER__ADDRESS: 0.0.0.0:4433
      # Used for links Nogon generates (RSS, file previews in MCP replies).
      # Browsing and search work on any hostname thanks to the nginx front.
      NOGON__SERVER__BASE_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      NOGON__APP__ACCESS_TOKEN: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/nogon:/nogon/data
