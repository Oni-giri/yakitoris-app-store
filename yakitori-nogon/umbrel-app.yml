id: yakitori-nogon
category: productivity
name: Nogon
version: "0.22.0-1"
tagline: Your own search engine for the pages you visit and the files you keep
icon: https://raw.githubusercontent.com/asciimoo/nogon/v0.22.0/webui/website/static/logo.png
description: >-
  Nogon (formerly Hister) is a private, full-text search engine for your
  browsing history. Its Firefox and Chrome extensions send the pages you visit
  to your Umbrel, where Nogon indexes their full contents so you can find them
  again later from the web interface, the terminal, or an AI assistant
  connected through MCP. It can also import existing browser history and
  bookmarks, crawl sites, and index files. There is no telemetry and nothing
  leaves your Umbrel unless you configure optional semantic search.


  First login: Nogon is protected by an access token, which is the password
  shown on this app's page in the Umbrel app store. Open Nogon and enter it
  once to unlock the web interface.


  Browser extension: install it for Firefox or Chrome, then in its options set
  the server URL to the address you use for this app (for example
  http://umbrel.local:4433, your Umbrel's IP, or its Tailscale address) and
  paste the same access token. The extension's endpoints bypass Umbrel's own
  login so it can reach Nogon, and are protected by that token instead.


  MCP: point your AI client at http://<your-umbrel>:4433/mcp and send the token
  as "Authorization: Bearer <token>".


  Web search works on every address you reach your Umbrel by, including
  Tailscale. Links Nogon generates itself (RSS feeds, file previews in MCP
  replies) point at umbrel.local.
releaseNotes: >-
  Web search now works when you open Nogon over Tailscale or by IP address,
  not only on umbrel.local.
