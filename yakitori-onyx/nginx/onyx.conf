# Onyx front-end nginx for Umbrel.
#
# Reproduces the routing from Onyx's upstream template
# (deployment/data/nginx/app.conf.template): /api/* and /openapi.json and
# /scim/* go to the backend API on :8080 (with the /api prefix stripped),
# everything else goes to the Next.js frontend on :3000, with WebSocket upgrade
# support and 5 GB uploads.
#
# Differences from upstream, for Umbrel:
#   - Upstreams are addressed by their unique container names because all Umbrel
#     apps share one Docker network and the bare names are not guaranteed unique.
#   - We resolve those names at request time via Docker's embedded DNS
#     (127.0.0.11) instead of using `upstream {}` blocks, so this container does
#     not crash if the backend isn't up yet and survives backends getting new
#     IPs across restarts.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5G;

    # Request-time DNS resolution (see header note).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $onyx_api yakitori-onyx_api_server_1:8080;
    set $onyx_web yakitori-onyx_web_server_1:3000;

    location ~ ^/scim(/.*)?$ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_redirect off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://$onyx_api;
    }

    # Match both /api/* and /openapi.json; strip the /api prefix before proxying.
    location ~ ^/(api|openapi.json)(/.*)?$ {
        rewrite ^/api(/.*)$ $1 break;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_redirect off;
        proxy_pass http://$onyx_api;
    }

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_redirect off;
        proxy_pass http://$onyx_web;
    }
}
