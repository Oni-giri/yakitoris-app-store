version: "3.7"

services:
  app_proxy:
    environment:
      # The launcher's proxy (see image/launcher.mjs) is the entry point. It
      # forwards to dsh on loopback inside the container and hands over dsh's
      # per-process launch token, so Umbrel's login is the access control.
      APP_HOST: yakitori-deepseek-harness_web_1
      APP_PORT: 8080

  # Built on the Umbrel from image/ (umbrelOS runs `docker compose up --build`).
  # The image is the stock Node image plus the pinned @deepseek-ai/dsh release
  # and the launcher; nothing is downloaded when the app starts.
  # The context must be absolute: umbrelOS passes its own common compose file
  # first, and Compose resolves relative paths against that file's directory.
  web:
    build: ${APP_DATA_DIR}/image
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 30s
    working_dir: /data
    environment:
      DATA_DIR: /data
      # Settings, the DeepSeek API key (.credentials.yaml) and session history.
      DSH_HOME: /data/home
      HOME: /data/home
      # The agent's working directory: files it reads and writes live here.
      DSH_WORKSPACE: /data/workspace
      LISTEN_PORT: "8080"
      DSH_PORT: "3081"
      # Don't send usage telemetry from this server.
      DSH_TELEMETRY_MODE: DISABLED
    volumes:
      - ${APP_DATA_DIR}/data:/data
