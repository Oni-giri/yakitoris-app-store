version: "3.7"

services:
  app_proxy:
    environment:
      # The launcher's proxy (see image/launcher.mjs) is the entry point. It
      # forwards to dsh on loopback inside the container and hands over dsh's
      # per-process launch token, so Umbrel's login is the access control.
      APP_HOST: yakitori-deepseek-harness_web_1
      APP_PORT: 8080

  # Built and published by https://github.com/Oni-giri/deepseek-harness-umbrel:
  # the stock Node image plus the pinned @deepseek-ai/dsh release and the
  # launcher; nothing is downloaded when the app starts.
  web:
    image: ghcr.io/oni-giri/deepseek-harness:0.2.1-rc.5@sha256:c70ad61102cd264cfe0e8ea55aefc4c68399603c7bad09b4eb8c4b0fddfe4662
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 30s
    working_dir: /data
    environment:
      DATA_DIR: /data
      # Settings, the DeepSeek API key (.credentials.yaml) and session history.
      DSH_HOME: /data/home
      HOME: /data/home
      # The agent's working directory: files it reads and writes live here.
      DSH_WORKSPACE: /data/workspace
      LISTEN_PORT: "8080"
      DSH_PORT: "3081"
      # Don't send usage telemetry from this server.
      DSH_TELEMETRY_MODE: DISABLED
    volumes:
      - ${APP_DATA_DIR}/data:/data
