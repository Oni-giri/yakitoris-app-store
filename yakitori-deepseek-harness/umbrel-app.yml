name: DeepSeek Harness
version: "0.2.1-rc.5-3"
tagline: DeepSeek's open-source agent harness, in your browser
icon: https://github.com/deepseek-ai.png
description: >-
  DeepSeek Harness (dsh) is the open-source agent harness from DeepSeek AI. Chat
  with DeepSeek models in the browser, keep your session history on your Umbrel,
  and let the agent work with files, run shell commands, search the web and use
  MCP servers and plugins.


  After installing, open the app, go to Settings → Models and add your DeepSeek
  API key (or another supported provider). The key is stored only on your Umbrel.


  The agent can execute model-generated commands. It runs inside this app's
  container and works in the app's own workspace folder, but it still has network
  access and can read or change anything in that folder. DeepSeek Harness is a
  developer preview that has not been security audited; review its safety notice
  before relying on it.


  This package builds a small image on your Umbrel from the official npm release
  and the standard Node.js image, so installing takes a few minutes.
releaseNotes: >-
  Fixes the previous release failing to start: Umbrel could not find the files
  it needs to build the app's image.


  DeepSeek Harness is now installed into the app's image while Umbrel installs
  the app, instead of being downloaded on first start, so the app opens right
  away. The old download in the app's data folder is removed automatically;
  settings, your API key and sessions are kept.
