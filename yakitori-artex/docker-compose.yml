version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-artex_server_1
      APP_PORT: 8787
      # The ARTEX browser extension posts capture to /api/traffic/ingest with
      # ARTEX's own Bearer JWT; it can't carry Umbrel's login cookie.
      PROXY_AUTH_WHITELIST: "/api/traffic/ingest"
      # ARTEX streams activity over SSE: the proxy must not buffer it.
      PROXY_TRUST_PROXY: "1"

  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${APP_ARTEX_DB_PASSWORD}
      POSTGRES_DB: artex
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ghcr.io/oni-giri/artex:latest
    restart: on-failure
    # ARTEX reloads its scanner tooling and agent processes; give it time.
    stop_grace_period: 1m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${APP_ARTEX_DB_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_JWT_KEY_DIR: /app/keys
      ARTEX_SECRET_KEY: ${APP_ARTEX_SECRET_KEY}
      # Umbrel's proxy reaches the app from the app network's gateway, so the
      # login rate limiter must read X-Forwarded-For from that subnet.
      ARTEX_TRUSTED_PROXIES: ${NETWORK_IP}/16
      ARTEX_NOISE_PROFILE: quiet
    volumes:
      - ${APP_DATA_DIR}/data/artex:/app/data
      - ${APP_DATA_DIR}/data/keys:/app/keys
