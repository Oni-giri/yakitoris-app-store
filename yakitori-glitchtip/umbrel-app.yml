manifestVersion: 2.0
id: yakitori-glitchtip
storage:
  dataRoot: data
category: developer
name: GlitchTip
version: "7.0.0"
tagline: Sentry-compatible error tracking, performance, logs, and uptime monitoring
icon: https://raw.githubusercontent.com/Oni-giri/yakitoris-app-store/master/yakitori-glitchtip/icon.png
description: >-
  GlitchTip is an open-source error tracking platform that speaks the Sentry
  protocol. Point any official Sentry SDK (JavaScript, Python, Go, Ruby, PHP,
  Java/Android, .NET, Rust, Elixir, native/minidump, and more) at a GlitchTip
  DSN and it collects exceptions, stack traces, and breadcrumbs, groups them
  into issues, and alerts you by email, Slack, Discord, Google Chat, Feishu, or
  generic webhooks (Mattermost, Rocket.Chat, and more). It also tracks performance transactions, ingests OpenTelemetry logs,
  symbolicates uploaded source maps, debug files, and ProGuard mappings, and
  runs uptime monitors with public status pages.


  This package runs GlitchTip's single all-in-one process (web UI, ingest, task
  worker, and scheduler) alongside PostgreSQL 18 and Valkey, with a per-device
  SECRET_KEY and database password. Events are kept for 90 days by default.


  🛠️ SET-UP INSTRUCTIONS


  Open GlitchTip and click **Register** to create the first account, then
  create your organization. Sign-up closes after the first account, and
  invitations can only reach people who already have one, so to add teammates
  set `ENABLE_USER_REGISTRATION` to `true` in this app's settings while they
  register, invite them from your organization's Members page, then set it back
  to `false`.


  Create a project to get its DSN and paste it into your Sentry SDK's `dsn`
  option. The DSN points at `https://<device>.local:8476`. Servers and CI
  runners that do not trust Umbrel's local certificate can use the same DSN
  with `http://` instead, because this port also answers plain HTTP. To use a
  Tailscale `.ts.net` name or another hostname in DSNs and links, set
  `GLITCHTIP_DOMAIN` in this app's settings.


  🤖 AI ASSISTANTS


  GlitchTip's built-in MCP server is enabled at `https://<device>.local:8476/mcp`.
  Connect an MCP client with OAuth or with a GlitchTip API token (Profile → Auth
  Tokens) sent as `Authorization: Bearer <token>`, and your assistant can read
  issues, events, traces, and logs.


  ⚠️ GOOD TO KNOW


  umbrelOS 2.0 or newer is required. Browser pages stay behind Umbrel's login,
  while event ingest and the REST API (`/api/*`), OTLP logs (`/v1/logs`), and
  MCP (`/mcp/*`) bypass it, so SDKs, `sentry-cli`, and agents authenticate
  directly with GlitchTip's DSN keys and tokens. Public status pages stay behind
  Umbrel's login unless you turn off "Require Umbrel login" for this app.


  Email is off until you set `EMAIL_URL` (for example
  `smtp://user:password@smtp.example.com:587`) and `DEFAULT_FROM_EMAIL`; without
  it there are no email alerts, verification mails, or password resets, so keep
  your password somewhere safe. Uptime monitors cannot target LAN addresses
  until you enable `GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS`.
releaseNotes: >-
  Initial Umbrel package of GlitchTip 7.0.0 (amd64 and arm64), with PostgreSQL
  18, persistent Valkey, HTTPS sessions on umbrelOS 2.0+, direct SDK, API, OTLP,
  and MCP passthrough, and the built-in MCP server enabled for AI assistants.
developer: Burke Software and Consulting
website: https://glitchtip.com
dependencies: []
repo: https://gitlab.com/glitchtip/glitchtip-backend
support: https://gitlab.com/glitchtip/glitchtip-backend/-/issues
port: 8476
requiresHttps: true
gallery:
  - https://glitchtip.com/assets/home/dashboard-hero@1x.png
  - https://glitchtip.com/assets/home/issues-list@1x.png
path: ""
defaultUsername: ""
defaultPassword: ""
environment:
  - name: GLITCHTIP_DOMAIN
    services:
      - web
    note: >-
      Base URL used in DSNs, email links, and MCP/OAuth metadata. Leave unset for
      https://<device>.local:8476, or set your Tailscale URL (e.g.
      https://<node>.<tailnet>.ts.net:8476). An http:// URL also disables Secure
      cookies.
  - name: EMAIL_URL
    services:
      - web
    note: >-
      Optional SMTP URL that turns on email alerts, invitations, verification,
      and password resets, e.g. smtp://user:password@smtp.example.com:587
      (URL-encode special characters in the password).
  - name: DEFAULT_FROM_EMAIL
    services:
      - web
    note: >-
      Sender address for GlitchTip's emails, e.g. glitchtip@example.com. Only
      used when EMAIL_URL is set.
  - name: ENABLE_USER_REGISTRATION
    default: "false"
    options:
      - "false"
      - "true"
    services:
      - web
    note: >-
      Allow anyone who can reach GlitchTip to create an account. When false
      (default), only the first account can sign up and invitations only reach
      existing accounts; turn it on while teammates register.
  - name: GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS
    default: "false"
    options:
      - "false"
      - "true"
    services:
      - web
    note: >-
      Let uptime monitors check LAN, loopback, and Docker addresses such as
      other apps on this Umbrel. Off by default to block SSRF against your local
      network.
  - name: GLITCHTIP_ENABLE_MCP
    default: "true"
    options:
      - "true"
      - "false"
    services:
      - web
    note: >-
      Serve GlitchTip's built-in MCP server at /mcp for AI assistants. Requests
      still need a GlitchTip API token or OAuth sign-in.
  - name: GLITCHTIP_RETENTION_DAYS
    default: "90"
    services:
      - web
    note: >-
      Days to keep error events, transactions, logs, uptime checks, and uploaded
      files before automatic cleanup. Lowering it deletes older data on the next
      cleanup run.
submitter: Yakitori
submission: https://github.com/Oni-giri/yakitoris-app-store
