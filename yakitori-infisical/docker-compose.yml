# Infisical 0.167.15 standalone, adapted for umbrelOS 2.0+:
#   1. Served over Umbrel's HTTPS proxy so Secure refresh cookies, WebAuthn
#      passkeys, OAuth callbacks, and CLI/SDK/agent URLs share one HTTPS origin.
#   2. API (including Agent Vault, ACME, OIDC discovery, and SCIM), secret-scanning
#      webhook, SCEP, and EST routes bypass Umbrel's browser login so CLIs, SDKs,
#      agents, and enrollment clients authenticate directly with Infisical.
#      Whitelist audit against the v0.167.15 routers (backend/src/server/routes,
#      backend/src/ee/routes): every /api route runs verifyAuth (JWT, machine
#      identity, service token, or OAuth) except routes built for external
#      callers that carry their own credential: machine-identity and LDAP/OIDC/
#      SSO logins and callbacks, ACME/EST/SCEP/OCSP/CRL for PKI clients, shared-
#      secret and secret-request links (unguessable id plus key), MFA and
#      email-token flows (account recovery, password reset; no SMTP by default),
#      and public CA certificates and JWKS. Self-service sign-up closes when
#      first-run setup completes (completeSetup({closeSignUp: true})). The only
#      routes that could take over the instance are POST /api/v1/admin/signup
#      and /api/v1/admin/bootstrap before setup; INITIAL_SETUP_ACTIVATION_TOKEN
#      (Umbrel's per-device app password) makes both require a secret only the
#      owner sees. A PROXY_AUTH_BLACKLIST would not be enough there, because
#      Fastify decodes percent-escapes the gateway matches literally.
#   3. Independent per-device secrets (including a 256-bit ROOT_ENCRYPTION_KEY)
#      are derived from the Umbrel seed in exports.sh.
#   4. PostgreSQL and password-protected Redis (with AOF persistence) store
#      state under APP_DATA_DIR/data.
#   5. All images are pinned to release tags and multi-architecture digests.

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-infisical_backend_1
      APP_PORT: 8080
      # Non-browser clients (Infisical CLI, SDKs, @infisical/mcp, machine
      # identities, Agent Vault under /api/v1/agent-vault/*, ACME/OIDC/SCIM,
      # Git webhooks, and PKI SCEP/EST clients) authenticate with Infisical
      # directly and cannot complete Umbrel's login page. Include both exact
      # prefixes and /* wildcards so bare prefix probes do not 302 to app-auth.
      PROXY_AUTH_WHITELIST: "/api,/api/*,/secret-scanning/webhooks,/secret-scanning/webhooks/*,/.well-known/est,/.well-known/est/*,/scep,/scep/*"
      # Keep long-lived SSE / Agent Vault / PAM WebSocket streams open across Umbrel's proxy.
      PROXY_TIMEOUT: 3600000

  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${APP_INFISICAL_POSTGRES_PASSWORD}
      POSTGRES_DB: infisical
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP: the temporary server the entrypoint runs during first-boot
      # initdb listens only on the Unix socket, so a socket probe passes too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U infisical -d infisical"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: on-failure
    stop_grace_period: 30s
    # The password comes from the environment so it never appears in the
    # process arguments.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${APP_INFISICAL_REDIS_PASSWORD}
      REDISCLI_AUTH: ${APP_INFISICAL_REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      # redis-cli exits 0 even on NOAUTH, so require the PONG reply.
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    image: infisical/infisical:v0.167.15@sha256:dcf4e51364c03f2263769a45cb03be42c7caf9caa3dc18d4eeba344faeed8a1e
    restart: on-failure
    init: true
    stop_grace_period: 1m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      HTTPS_ENABLED: "true"
      SITE_URL: ${APP_INFISICAL_SITE_URL}
      # 256-bit base64 KEK derived from the Umbrel seed. If rotating via Infisical's
      # Admin Console (which generates a 32-char hex key in non-FIPS mode), set the
      # new key in ENCRYPTION_KEY via Umbrel App Settings (it overrides ROOT_ENCRYPTION_KEY).
      ROOT_ENCRYPTION_KEY: ${APP_INFISICAL_ROOT_ENCRYPTION_KEY}
      AUTH_SECRET: ${APP_INFISICAL_AUTH_SECRET}
      DB_CONNECTION_URI: postgresql://infisical:${APP_INFISICAL_POSTGRES_PASSWORD}@yakitori-infisical_postgres_1:5432/infisical?sslmode=disable
      REDIS_URL: redis://:${APP_INFISICAL_REDIS_PASSWORD}@yakitori-infisical_redis_1:6379
      # /api/* bypasses Umbrel login, so first-run admin sign-up and API
      # bootstrap must not be open to anyone on the LAN before the owner
      # finishes setup. Infisical then requires this token; Umbrel shows it as
      # the app's password (deterministicPassword). Ignored once set up.
      INITIAL_SETUP_ACTIVATION_TOKEN: ${APP_PASSWORD}
      # Trust X-Forwarded-For only from Umbrel's Docker bridge subnet so external
      # clients cannot spoof proxy headers. Note: umbrelOS 2.0's HTTPS LAN ingress
      # connects to AppGateway over loopback without forwarding the peer IP, so
      # HTTPS requests arrive with X-Forwarded-For: 127.0.0.1.
      TRUSTED_PROXY_CIDRS: ${APP_INFISICAL_TRUSTED_PROXIES:-10.21.0.0/16}
      TELEMETRY_ENABLED: "false"
      ANNOUNCEMENTS_ENABLED: "false"
      OTEL_TELEMETRY_COLLECTION_ENABLED: "false"
      DISABLE_UPDATE_CHECK: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
