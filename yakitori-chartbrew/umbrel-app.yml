manifestVersion: 2.0
id: yakitori-chartbrew
storage:
  dataRoot: data
category: developer
name: Chartbrew
version: "6.0.1-umbrel.1"
tagline: Live dashboards and reports from your databases and APIs, with an AI assistant
icon: https://avatars.githubusercontent.com/u/57401255?s=512&v=4
description: >-
  Chartbrew is an open-source reporting platform for building live dashboards
  and client reports from PostgreSQL, MySQL, MongoDB, ClickHouse, Supabase,
  TimescaleDB, Firestore, Realtime Database, Strapi, Stripe, Google Analytics,
  Customer.io, Jira, REST APIs, and MCP servers. Write SQL or use the visual
  query builder, turn results into reusable datasets, and arrange charts, KPIs,
  tables, and filters on dashboards that refresh on a schedule. Share them as
  reports or embeddable charts, set data alerts, and email snapshot reports.


  🛠️ SET-UP INSTRUCTIONS


  Open the app and create your account. Only this first account can sign up on
  its own; invite everyone else from your team settings. The first start runs
  every database migration and can take a couple of minutes.


  Data sources on your LAN, your tailnet, or this Umbrel are reachable out of
  the box. Upstream blocks private network ranges by default; set
  `CB_ALLOW_PRIVATE_NETWORK_CALLS` to `false` in this app's settings to restore
  that. The AI assistant (natural-language charts, SQL generation, dashboard
  building) needs an OpenAI API key in `CB_OPENAI_API_KEY`. Email (invites,
  password resets, snapshot reports) needs the `CB_MAIL_*` SMTP settings.


  For AI agents and scripts: create an API key in Team settings > API keys, then
  call the Data API at `https://<device>.local:4018/api/v1/...` or connect an MCP
  client to `https://<device>.local:4018/mcp` (API key or OAuth). Keys are scoped:
  reading data is the default; refresh, preview, and dataset writes are opt-in.
  Only clients on your network or tailnet can connect; hosted connectors such as
  claude.ai or ChatGPT cannot reach your Umbrel.


  ⚠️ GOOD TO KNOW


  umbrelOS 2.0 or newer is required. Pages, sign-up, sign-in, and the rest of
  the API stay behind Umbrel's login. The Data API (`/api/v1/*`), MCP (`/mcp`),
  and MCP's OAuth endpoints (`/.well-known/oauth-*`, `/oauth/token`,
  `/oauth/register`, `/oauth/revoke`, `/mcp/oauth/client-metadata`) bypass it
  and are authenticated by Chartbrew with API keys or OAuth tokens.


  MCP OAuth only accepts the address in `CB_SITE_URL` (default
  `https://<device>.local:4018`). To connect agents over Tailscale, set it to
  your `tailscale serve` HTTPS address. Umbrel's own certificate does not cover
  `.ts.net` names.


  Public dashboards, report links, and embedded charts stay behind Umbrel's
  login. To share them with people who have no Umbrel account, turn off
  "Require Umbrel login" for this app; Chartbrew still protects private pages
  and its API with its own accounts. Umbrel hides client IP addresses from
  apps, so Chartbrew's per-IP rate limits apply to all clients together.


  The in-app news feed and update check contact chartbrew.com.
releaseNotes: >-
  Security and reliability update for the Chartbrew 6.0.1 package.


  Only the Data API, MCP, and MCP's OAuth endpoints now skip Umbrel's login, so
  nobody on your network can claim the first account before you do. The
  built-in front end also no longer lets one request's body be read as a second
  request on the shared API connection.


  Scheduled and alert snapshot reports now render: Chartbrew's headless browser
  loads pages over the app's internal network instead of the public address. A
  failed database migration now restarts the API instead of leaving it idle.
  `CB_MAIL_SECURE=false` now works for STARTTLS on port 587, and the Data API is
  available at `/api/v1`.
developer: Chartbrew (Depomo Ltd)
website: https://chartbrew.com
dependencies: []
repo: https://github.com/chartbrew/chartbrew
support: https://github.com/chartbrew/chartbrew/issues
port: 4018
requiresHttps: true
gallery:
  - https://chartbrew-static.b-cdn.net/banners/hero-v4.webp
path: ""
defaultUsername: ""
defaultPassword: ""
environment:
  - name: CB_SITE_URL
    services:
      - server
    note: >-
      Main HTTPS address for MCP/OAuth metadata, email links, and integration
      callbacks. Leave unset for https://<device>.local:4018, or set a
      `tailscale serve` address such as https://<node>.<tailnet>.ts.net. Must
      start with https://.
  - name: CB_ALLOW_PRIVATE_NETWORK_CALLS
    default: "true"
    options:
      - "false"
      - "true"
    services:
      - server
    note: >-
      Allow data sources on private networks (LAN, Tailscale, this Umbrel).
      Set to false to block them as upstream does by default.
  - name: CB_OPENAI_API_KEY
    services:
      - server
    note: >-
      Optional OpenAI API key for the AI assistant, SQL generation, and
      AI-built charts and dashboards.
  - name: CB_OPENAI_MODEL
    default: "gpt-5.4-mini"
    services:
      - server
    note: >-
      Optional OpenAI model ID for the AI assistant (defaults to gpt-5.4-mini).
  - name: CB_MAIL_HOST
    services:
      - server
    note: Optional SMTP host for invites, password resets, and snapshot emails.
  - name: CB_MAIL_PORT
    default: "465"
    services:
      - server
    note: SMTP port (465 with CB_MAIL_SECURE=true, 587 with CB_MAIL_SECURE=false).
  - name: CB_MAIL_SECURE
    default: "true"
    options:
      - "false"
      - "true"
    services:
      - server
    note: >-
      true for implicit TLS (usually port 465); false for STARTTLS or plain
      SMTP (usually port 587).
  - name: CB_MAIL_USER
    services:
      - server
    note: SMTP username.
  - name: CB_MAIL_PASS
    services:
      - server
    note: SMTP password.
  - name: CB_ADMIN_MAIL
    services:
      - server
    note: Sender address for all emails Chartbrew sends.
submitter: Yakitori
submission: https://github.com/Oni-giri/yakitoris-app-store
