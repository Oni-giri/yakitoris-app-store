name: Komga
version: "1.25.0"
tagline: Self-hosted media server for comics, manga, and ebooks
icon: https://raw.githubusercontent.com/gotson/komga/master/.github/readme-images/app-icon.png
description: >-
  Komga is a self-hosted media server for your comics, mangas, BDs, magazines,
  and eBooks. Point it at your existing folders and it organizes everything
  into libraries, series, and collections, with automatic metadata scraping
  and thumbnail generation.


  Read directly in the browser with a full-featured web reader (continuous,
  paged, and webtoon modes), or connect external apps and e-readers over
  OPDS, OPDS-PSE, and the Komga API, including native Kobo sync support. Track
  reading progress, build reading lists across series, and manage multiple
  user accounts with per-library access restrictions and age ratings.


  Supports CBZ/CBR/CB7, PDF, and EPUB, with duplicate-page detection,
  side-by-side metadata editing, and a REST API for automation.
releaseNotes: >-
  Initial packaging of Komga 1.25.0 for Umbrel. On first launch, open the app
  — since no account exists yet, Komga shows a "claim" screen where you set
  the admin email and password yourself. From there, add a library pointing
  at a folder under /data and Komga will scan and organize it. Your Umbrel
  Documents and Downloads folders are mounted read-only at /data/documents
  and /data/downloads.
