version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: yakitori-komga_komga_1
      APP_PORT: 25600

  komga:
    image: ghcr.io/gotson/komga:1.30.0@sha256:3ae42f88511211e0ec2637d88f3df1b709d07cfb093427e58444ae200a62608e
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: UTC
      # Raise if large libraries cause OutOfMemoryException, e.g. "-Xmx4g".
      # JAVA_TOOL_OPTIONS: "-Xmx2g"
    volumes:
      # Database and app config. Komga's docs warn against network filesystems here.
      - ${APP_DATA_DIR}/config:/config
      # Point your libraries at subfolders of this directory from within Komga.
      - ${APP_DATA_DIR}/data:/data
      # Umbrel's shared Documents and Downloads folders, read-only so Komga's
      # library scan/metadata tools can't modify files you manage elsewhere.
      - ${UMBREL_ROOT}/home/Documents:/data/documents:ro
      - ${UMBREL_ROOT}/home/Downloads:/data/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:25600/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
