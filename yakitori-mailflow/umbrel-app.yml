manifestVersion: 1
id: yakitori-mailflow
category: networking
name: MailFlow
version: "1.1.3-1"
tagline: Unified self-hosted webmail client
icon: https://github.com/maathimself/mailflow/raw/main/media/mailflow-logo.png
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.

  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Fixes intermittent database and Redis connectivity on Umbrel installations
  running other apps with PostgreSQL or Redis services, and fixes the frontend
  healthcheck on IPv6-enabled containers.
